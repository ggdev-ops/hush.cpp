name: Android CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "examples/hush-android/gradlew" ]; then
          chmod +x examples/hush-android/gradlew
        else
          # If no wrapper, we might need to use installed gradle
          echo "No gradlew found, will try using 'gradle' directly."
        fi

    - name: Build with Gradle
      run: |
        cd examples/hush-android
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi
