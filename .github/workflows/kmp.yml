name: KMP CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build KMP with Gradle
      run: |
        cd examples/hush-kmp
        # We might need to install cmake if not present, but it's usually on ubuntu-latest
        if [ -f "./gradlew" ]; then
          ./gradlew :hush:assemble
        else
          gradle :hush:assemble
        fi
